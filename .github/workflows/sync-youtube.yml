name: Sync YouTube

# Refreshes src/data/videos.json from the YouTube Data API and commits it only
# when it actually changed. The script is quota-frugal by construction (see the
# header comment in scripts/sync-youtube.ts): ~5 units for a 100-video channel
# against a 10,000/day allowance.

on:
  schedule:
    # 04:17 UTC nightly — off the hour so it does not pile onto the rush.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-youtube
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync videos
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
        run: npm run sync:youtube

      # The published site IS the committed docs/ folder, so writing the JSON
      # into src/ is only half the job: without this the data sits in the repo
      # and never reaches a page. Verified the hard way — 27 videos landed in
      # src/data/videos.json and the live Library still showed six entries.
      #
      # This does not put CI in the publish path. If this step ever breaks, the
      # last good docs/ keeps serving; the Action is an author, not the printer.
      - name: Rebuild the site
        run: npm run build

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/videos.json; then
            echo "No change to src/data/videos.json — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/videos.json docs
          git commit -m "chore(videos): sync YouTube feed"
          git push
