name: Sync YouTube

# Refreshes src/data/videos.json from the YouTube Data API and commits it only
# when it actually changed. The script is quota-frugal by construction (see the
# header comment in scripts/sync-youtube.ts): ~5 units for a 100-video channel
# against a 10,000/day allowance.

on:
  schedule:
    # 04:17 UTC nightly — off the hour so it does not pile onto the rush.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-youtube
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The sync script treats missing credentials as "fresh clone, skip quietly"
      # and exits 0. That is right on a laptop and wrong here: in a scheduled job
      # an absent secret means a rotated or deleted key, and a green run that did
      # nothing looks exactly like a green run with no new videos. Fail loudly.
      - name: Require credentials
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
        run: |
          missing=
          [ -z "$YT_API_KEY" ]     && missing="$missing YT_API_KEY"
          [ -z "$YT_CHANNEL_ID" ]  && missing="$missing YT_CHANNEL_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi

      - name: Sync videos
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
        run: npm run sync:youtube

      # The published site IS the committed docs/ folder, so writing the JSON
      # into src/ is only half the job: without this the data sits in the repo
      # and never reaches a page. Verified the hard way — 27 videos landed in
      # src/data/videos.json and the live Library still showed six entries.
      #
      # This does not put CI in the publish path. If this step ever breaks, the
      # last good docs/ keeps serving; the Action is an author, not the printer.
      - name: Rebuild the site
        run: npm run build

      # public/thumbs is staged explicitly. It is real source, not build output:
      # the script downloads each thumbnail once and videos.json then points at
      # /thumbs/... forever. Leaving it untracked is what used to make the weekly
      # metrics job rebuild a docs/ with no thumbnails and commit 81 deletions.
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/videos.json public/thumbs; then
            echo "No change to the video data — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/videos.json public/thumbs docs
          git commit -m "chore(videos): sync YouTube feed"
          # Another job (or a person) may have pushed since checkout. Rebase onto
          # whatever landed and try again rather than failing and losing the sync.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main."
            git pull --rebase --autostash origin main
          done
          echo "::error::Could not push after 3 attempts."
          exit 1
