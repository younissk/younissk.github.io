<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Workbench:SCAN@-53&display=swap"
      rel="stylesheet"
    />
    <style type="text/tailwindcss">
      @theme {
        --font-workbench: "Workbench", sans-serif;
      }

      @layer base {
        :root {
          --neon-blue: #4cc9f0;
          --neon-red: #f72585;
          --neon-green: #4ade80;
          --crt-background: #141414;
          --terminal-bg: #1a1b26;
          --terminal-text: #a9b1d6;
        }

        @keyframes scanline {
          0% { transform: translateY(0); }
          100% { transform: translateY(100vh); }
        }

        @keyframes textShadow {
          0% { text-shadow: 0.4389924193300864px 0 1px rgba(0,30,255,0.5), -0.4389924193300864px 0 1px rgba(255,0,80,0.3), 0 0 3px; }
          5% { text-shadow: 2.7928974010788217px 0 1px rgba(0,30,255,0.5), -2.7928974010788217px 0 1px rgba(255,0,80,0.3), 0 0 3px; }
          /* Add more textShadow keyframes for glitch effect */
        }

        @keyframes flicker {
          0% { opacity: 0.9; }
          5% { opacity: 0.85; }
          10% { opacity: 0.9; }
          15% { opacity: 0.85; }
          20% { opacity: 0.9; }
          /* Add more flicker keyframes */
        }

        .crt-overlay::before {
          content: "";
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100vh;
          background: repeating-linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.15),
            rgba(0, 0, 0, 0.15) 1px,
            transparent 1px,
            transparent 2px
          );
          pointer-events: none;
          animation: scanline 10s linear infinite;
        }

        .crt-overlay::after {
          content: "";
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100vh;
          background: radial-gradient(
            circle at center,
            transparent 0%,
            rgba(0, 0, 0, 0.2) 100%
          );
          pointer-events: none;
        }

        .arcade-border {
          @apply border-2 relative overflow-hidden;
          box-shadow: 0 0 5px var(--neon-blue),
                      inset 0 0 5px var(--neon-blue);
          transition: all 0.3s ease;
        }

        .arcade-border:hover {
          box-shadow: 0 0 10px var(--neon-blue),
                      inset 0 0 10px var(--neon-blue);
          transform: scale(1.02);
        }

        .arcade-text {
          animation: textShadow 1.6s infinite;
        }

        .neon-glow {
          animation: flicker 2s infinite;
        }
      }
    </style>
    <title>Youniss's Arcade</title>
  </head>
  <body class="font-workbench bg-[var(--crt-background)] text-center text-white crt-overlay">
    <section
      id="home"
      class="h-screen flex flex-col items-center justify-center"
    >
      <div class="mb-8 arcade-text neon-glow">
        <h2 class="text-3xl mb-2" style="color: var(--neon-green)">Asalamu alaykum</h2>
        <h2 class="text-5xl tracking-wider">
          I'm <span style="color: var(--neon-blue)">Youniss</span>
        </h2>
      </div>
      <div class="relative mb-8">
        <h2 class="text-4xl mb-2 arcade-text" style="color: var(--neon-red)">SELECT MODE</h2>
        <div class="absolute -inset-1 bg-gradient-to-r from-transparent via-[var(--neon-red)] to-transparent opacity-20 blur-sm"></div>
      </div>
      <div class="flex flex-col gap-4">
        <mode-card
          title="ML and AI"
          icon="/icons/Brain.png"
          href="#ml-and-ai"
          color="red-300"
        ></mode-card>
        <mode-card
          title="Web Dev"
          icon="/icons/Internet.png"
          href="#web-dev"
          color="blue-300"
        ></mode-card>
        <mode-card
          title="Education"
          icon="/icons/School.png"
          href="#education"
          color="green-300"
        ></mode-card>
      </div>
    </section>
    <section-container
      title="ML and AI"
      icon="/icons/Brain.png"
      color="red-300"
      section="ml-ai"
    >
    </section-container>
    <section-container
      title="Web Dev"
      icon="/icons/Internet.png"
      color="blue-300"
      section="web-dev"
    >
    </section-container>
    <section-container
      title="Education"
      icon="/icons/School.png"
      color="green-300"
      section="education"
    >
    </section-container>
    
    <!-- Contact Section -->
    <section id="contact" class="block">
      <div class="min-h-screen mt-4 flex flex-col items-center">
        <div class="sticky top-0 w-full max-w-4xl z-50">
          <div class="relative mb-4">
            <div class="absolute inset-0 opacity-70"></div>
            <mode-card
              title="Contact"
              icon="/icons/Chain.png"
              href="#contact"
              color="green-300"
            ></mode-card>
          </div>
        </div>
        <div class="w-full max-w-4xl p-8 relative">
          <div class="absolute inset-0 bg-gradient-to-b from-black/50 to-transparent pointer-events-none"></div>
          <div class="relative z-10">
            <contact-form access-key="YOUR_WEB3FORMS_ACCESS_KEY"></contact-form>
          </div>
        </div>
      </div>
    </section>
    
    <!-- Social Links -->
    <social-links></social-links>
  </body>
  <script src="js/data-loader.js"></script>
  <script src="js/mode-card.js"></script>
  <script src="js/section-container.js"></script>
  <script src="js/jupyter-components.js"></script>
  <script src="js/contact-form.js"></script>
</html>
