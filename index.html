<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Workbench:SCAN@-53&display=swap"
      rel="stylesheet"
    />
    <style type="text/tailwindcss">
      @theme {
        --font-workbench: "Workbench", sans-serif;
      }
    </style>
    <title>Test</title>
  </head>
  <body class="font-workbench bg-[#222222] text-center text-white">
    <section
      id="home"
      class="h-screen flex flex-col items-center justify-center"
    >
      <div class="mb-8">
        <h2 class="text-3xl">Asalamu alaykum</h2>
        <h2 class="text-5xl tracking-wider">
          I'm <span class="text-blue-300">Youniss</span>
        </h2>
      </div>
      <h2 class="text-3xl mb-2">Select Mode</h2>
      <div class="flex flex-col gap-2">
        <mode-card
          title="ML and AI"
          icon="/icons/Brain.png"
          href="#ml-and-ai"
          color="red-300"
        ></mode-card>
        <mode-card
          title="Web Dev"
          icon="/icons/Internet.png"
          href="#web-dev"
          color="blue-300"
        ></mode-card>
        <mode-card
          title="Education"
          icon="/icons/School.png"
          href="#education"
          color="green-300"
        ></mode-card>
      </div>
    </section>
    <section-container
      title="ML and AI"
      icon="/icons/Brain.png"
      color="red-300"
      section="ml-ai"
    >
    </section-container>
    <section-container
      title="Web Dev"
      icon="/icons/Internet.png"
      color="blue-300"
      section="web-dev"
    >
    </section-container>
    <section-container
      title="Education"
      icon="/icons/School.png"
      color="green-300"
      section="education"
    >
    </section-container>
  </body>
  <script src="js/data-loader.js"></script>
  <script src="js/mode-card.js"></script>
  <script src="js/section-container.js"></script>
  <script src="js/jupyter-components.js"></script>
</html>
